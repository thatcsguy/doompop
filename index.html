<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>doompop studio</title>
  <link rel="icon" href="data:," />
  <style>
    html, body { margin: 0; height: 100%; background: #0b0b0d; color: #ddd; font: 13px/1.4 ui-monospace, Menlo, monospace; }
    body.render { background: #000; }
    #view { position: fixed; inset: 0 0 64px 0; display: grid; place-items: center; }
    body.render #view, body.clean #view { inset: 0; }
    #view canvas { max-width: 100%; max-height: 100%; aspect-ratio: 16 / 9; background: #000; }
    #bar { position: fixed; left: 0; right: 0; bottom: 0; height: 64px; padding: 0 12px; box-sizing: border-box; }
    body.render #bar, body.clean #bar { display: none; }
    #scrub { position: relative; height: 34px; margin-top: 6px; cursor: pointer; background: #17171b; }
    #scrub .sec { position: absolute; top: 0; height: 10px; font-size: 9px; color: #889; overflow: hidden; white-space: nowrap; border-left: 1px solid #333; padding-left: 2px; }
    #scrub .shot { position: absolute; top: 12px; bottom: 0; border-left: 1px solid #444; background: rgba(255,255,255,0.04); }
    #scrub .shot.on { background: rgba(255,210,63,0.18); }
    #scrub .head { position: absolute; top: 0; bottom: 0; width: 2px; background: #ffd23f; }
    #info { display: flex; gap: 18px; margin-top: 4px; color: #aab; }
    #err { position: fixed; top: 8px; left: 8px; right: 8px; color: #ff6b6b; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div id="view"></div>
  <div id="bar"><div id="scrub"></div><div id="info"></div></div>
  <div id="err"></div>
  <script type="module" src="/engine/main.ts"></script>
</body>
</html>
